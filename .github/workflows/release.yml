name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build -platform windows/amd64 -o myrics-overlay.exe

      - name: Generate release README
        run: |
          mkdir -p build\dist
          @"
          # Myrics Overlay

          A lyrics overlay for Windows that syncs with whatever you're playing on YouTube Music.

          ## How to use

          1. Extract this zip anywhere
          2. Run `myrics-overlay.exe`
             - If Windows SmartScreen blocks it, click **More info → Run anyway**
          3. Play a song on YouTube Music — lyrics appear automatically

          ## Customization (optional)

          Open `configs\config.yaml` and change these values:

          - ``overlay.font_size`` — text size (default 18)
          - ``overlay.position`` — ``top``, ``center``, or ``bottom``
          - ``overlay.opacity`` — 0.0 (transparent) to 1.0 (solid)

          ## ACRCloud (Linux/macOS only)

          If you're on Linux/macOS and want audio-based detection, fill in your ACRCloud API keys in ``configs\config.yaml`` under ``acrcloud``. This is not needed on Windows — detection uses the system media controls.
          "@ | Out-File -FilePath build\dist\README.md -Encoding utf8

      - name: Package
        run: |
          mkdir -p build\dist\configs
          copy build\bin\myrics-overlay.exe build\dist\
          copy configs\config.yaml.example build\dist\configs\config.yaml
          Compress-Archive -Path build\dist\* -DestinationPath myrics-overlay-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: myrics-overlay-windows-amd64.zip

