<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myrics-overlay</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="overlay-container">
      <div class="lyrics-box" style="--wails-draggable: drag">
        <div class="song-row">
          <span id="song-info" class="song-info">Waiting for music…</span>
          <button
            id="toggle-btn"
            class="toggle-btn"
            onclick="toggleDetection()"
            title="Pause/resume detection (Space)"
          >⏸</button>
        </div>
        <p id="current-line" class="current"></p>
        <p id="next-line" class="next"></p>
      </div>
    </div>

    <script src="wailsjs/runtime/runtime.js"></script>
    <script src="app.js"></script>
  </body>
</html>
